# GitHub Actions: push main 自动部署到阿里云 ECS
# 触发方式：push 到 main 分支，或手动 dispatch
#
# 已配置（2026-09-06，仓库 Secrets）：DEPLOY_SSH_KEY（部署专用 ed25519 私钥，
#   公钥在 ECS root 的 authorized_keys，标注 github-actions-geo-deploy）、
#   DEPLOY_HOST（118.178.120.99）、DEPLOY_USER（root）、DEPLOY_PATH（/var/www/geo.alaa.org.cn）。
#
# 流程与 DEPLOY.md 手动发版完全一致：rsync（同款排除规则，生产库在
# /var/lib/geo-control 不受影响）→ systemctl restart geo-console → /api/ping 验证。
# v0.2.0 修复两处历史问题：①服务名此前写成 geo-control-console（服务器实际为
# geo-console，导致 copy 成功但服务从不重启）；②scp-action 不支持排除规则且无
# --delete，改为 runner 原生 rsync，与手动命令逐项一致。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to ECS（与 DEPLOY.md 手动发版同一命令与排除规则）
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'output' --exclude 'agent' --exclude '*.docx' \
            --exclude '.DS_Store' --exclude 'system/geodesk.db*' --exclude 'system/backups' \
            --exclude 'ai-eval-*' --exclude 'ux-review-*' --exclude 'system/test_e2e.py' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Restart service & verify
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'systemctl restart geo-console && sleep 2 && curl -sf -m 8 http://127.0.0.1:8340/api/ping && echo " service healthy"'

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key
