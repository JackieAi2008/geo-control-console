# nginx 配置片段——挂在 cmip.alaa.org.cn 的主站点 /geo 子路径下
# 把这段加到 cmip.alaa.org.cn 主站 nginx 配置的 server 块里
# （不要新建 server，否则会和 cmip 的 HTTPS 抢 listen 80/443）

# ---- 在 cmip.alaa.org.cn 主站 nginx 的 server { ... } 里加以下 location ----

# GEO 智控台：子路径 /geo/ 反代到本地 Python server
location ^~ /geo/ {
    proxy_pass http://127.0.0.1:8340/;
    # 子路径剥离：客户端请求 /geo/api/ping → 后端收到 /api/ping
    # rewrite 由 proxy_pass 自动处理（带 trailing slash 时会去掉前缀）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /geo;

    # SSE / 流式响应需要禁用缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;       # /api/chat 流式最长 5 分钟

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存
    location ~* /geo/(css|js)/.+\.(css|js)$ {
        proxy_pass http://127.0.0.1:8340/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 把 /geo 重定向到 /geo/（避免相对路径资源 404）
location = /geo {
    return 301 /geo/;
}