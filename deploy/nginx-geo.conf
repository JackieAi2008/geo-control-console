# GEO 智控台 —— cmip SSO 汇总站子系统（auth_request 统一鉴权）
server {
    server_name geo.alaa.org.cn;

    # 静态与 API 全部走同一后端；SSO 由 auth_request 统一把关
    location / {
        auth_request /_sso_auth;
        error_page 401 = @geo_login;

        auth_request_set $sso_user $upstream_http_x_sso_user;
        auth_request_set $sso_name $upstream_http_x_sso_name;
        auth_request_set $sso_role $upstream_http_x_sso_role;

        proxy_pass http://127.0.0.1:8340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 身份透传给后端（后端只信 localhost，未来可据此做用户级数据）
        proxy_set_header X-Geo-User $sso_user;
        proxy_set_header X-Geo-Name $sso_name;
        proxy_set_header X-Geo-Role $sso_role;
    }

    # /api/chat 是流式响应，关缓冲
    location /api/ {
        auth_request /_sso_auth;
        error_page 401 = @geo_login;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        proxy_pass http://127.0.0.1:8340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Geo-User $sso_user;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        auth_request /_sso_auth;
        error_page 401 = @geo_login;
        proxy_pass http://127.0.0.1:8340;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 内部鉴权子请求：转发浏览器带来的 cmip_sso cookie 到 cmip 门户后端校验
    location = /_sso_auth {
        internal;
        proxy_pass http://127.0.0.1:8009/api/sso/check?system=geo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host cmip.alaa.org.cn;
        proxy_set_header Cookie $http_cookie;
    }

    # 未登录 → cmip 门户登录页，带回跳地址
    location @geo_login {
        return 302 "https://cmip.alaa.org.cn/#/login?redirect=https%3A%2F%2Fgeo.alaa.org.cn%2F";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/geo.alaa.org.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/geo.alaa.org.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = geo.alaa.org.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name geo.alaa.org.cn;
    return 404; # managed by Certbot


}